  root_path: /Users/apple/Ageis Agent
  environment: development
execution:
  parallel: true
  max_workers: 4
  timeout_seconds: 300
  dry_run: false
  safe_mode: true
testing:
  unit: auto
  api: auto
  sanity: auto
  integration: auto
  e2e: auto
  ui: auto
  ux: auto
  accessibility: auto
  security: auto
  performance: auto
  compatibility: adaptive
ai:
  enabled: false
  provider: none
  model: ''
  max_tokens: 4096
  budget_usd: 1.0
